name: Relatar um problema / Bug report
description: Algo não funciona como esperado / Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir, procure uma issue igual. **Vulnerabilidades**: não use issue pública, siga o `SECURITY.md`.
        Before opening, search for a duplicate. **Vulnerabilities**: do not use a public issue, follow `SECURITY.md`.
  - type: input
    id: version
    attributes:
      label: Versão do projeto / Project version
      description: "Ex.: 1.2.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente / Environment
      description: "Sistema, linguagem e plataforma com versões (ex.: Python 3.13, Django 5.2, Moodle 5.3, navegador). / OS, language and platform with versions."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtido / Actual result
      description: Inclua mensagens de erro e, se possível, capturas de tela. Não inclua senhas nem dados pessoais. / Include error messages and, if possible, screenshots. Do not include passwords or personal data.
    validations:
      required: true
